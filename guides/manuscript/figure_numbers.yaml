# Manuscript numbering for the figure set: the one place a figure's number lives.
#
# Scripts, output filenames and tests name a figure by its content *stem*
# (``sH_contact_recovery``). This file says what the manuscript calls that stem
# ("Figure SH"). A re-order then edits this file instead of ~20 scripts, ~80
# output files, 50 test files and five documents.
#
# SUPPLEMENTARY LABELS ARE LETTERS, main-text labels are digits (20 Oct 2026).
# A supplementary figure is "Figure SA" .. "Figure SO" and a supplementary table
# is "Table SZ". The letter is a *name*, not a position: the draft cites the
# supplement in an order that is still moving, and a letter can be cited,
# re-ordered and renumbered in the manuscript at the end without every caption,
# document and test following it around. The manuscript's final S1..SN numbering
# is applied once, at submission, by walking the citations in order of first
# mention; until then nothing outside this file carries a supplementary digit.
# See FIGURE_LABELS.md for the letter -> content map a reader needs.
#
# PROVISIONAL. The ordering below is the draft's as of 15 Oct 2026; the draft is
# not finished and figures are still likely to move or be dropped. That is the
# point of the file: nothing outside it should have to change when they do.
#
# NOTE the stems are still numbered after their *old* slots (``s13_...`` is
# Figure SH). Stage 3 of the renumbering replaces the stems with content names;
# until then the leading number in a stem means nothing and only ``label`` does.
#
# Per entry:
#   label    what the manuscript calls it, or omitted for a stem that is a panel
#            or a supporting table rather than a numbered figure of its own.
#   parent   for a panel / supporting stem, the stem it belongs to.
#   retired  the code is kept but the figure has no manuscript slot.
#   note     why, where that is not obvious.
#
# Supplementary figure letters run A..O with no gaps, so a dropped figure still
# has to be noticed. Supplementary *tables* take their own letters and are not
# held to a run: Z is deliberately parked at the end of the alphabet so the one
# shipped table does not move every time a figure is added. The draft's full
# table ordering has not been supplied, and two shipped tables are both labelled
# S16 (see docs/notes/extended_red_team_tests.md A1); the rest join this file when that is
# settled.

