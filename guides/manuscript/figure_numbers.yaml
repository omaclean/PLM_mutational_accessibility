      are visible here: receptor-binding assays are excluded outright rather than given
      their own sign rule, and an optimum at the end of the swept range is kept rather
      than discarded. Extends the supplementary run to A..P with no gap.
      The stem carries no number on purpose, as for sO_masked_marginals.
