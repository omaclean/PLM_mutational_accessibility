    label: Figure SP
    note: >-
      new 22 Oct 2026, for transparency behind Figure SM: that figure reduces each deep
      mutational scanning arm to one optimum and counts the negative ones, and this one
      draws the curves those optima came from, so the count can be read against them.
      Added after an audit found the count's denominators moving between strata (13, 12,
